name: prawnBot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      - name: Statyczna analiza kodu (Linting)
        run: npm run lint

      - name: Kompilacja i budowanie produkcyjne
        run: npm run build --configuration=production

  docker_security_build:
    needs: test_and_lint
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Logowanie do rejestru kontenerów
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Przygotowanie Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Budowanie obrazu Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: prawnbot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skan podatności obrazu (Trivy Security Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'prawnbot:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
